<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1015"/>
      <stop offset="60%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="40%" stop-color="#c51b29"/>
      <stop offset="100%" stop-color="#7a0a14"/>
    </linearGradient>
    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1726"/>
    </linearGradient>
    <linearGradient id="lensGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Subtle Web & Dimension Grid in Background -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <circle cx="250" cy="270" r="100" fill="none"/>
    <circle cx="250" cy="270" r="180" fill="none"/>
    <circle cx="250" cy="270" r="260" fill="none"/>
    <line x1="250" y1="20" x2="250" y2="520"/>
    <line x1="50" y1="270" x2="450" y2="270"/>
    <line x1="90" y1="110" x2="410" y2="430"/>
    <line x1="90" y1="430" x2="410" y2="110"/>
  </g>

  <!-- Comic Halftone Dots Accent Corner -->
  <g fill="#c51b29" opacity="0.12">
    <circle cx="430" cy="60" r="3"/><circle cx="450" cy="60" r="3"/><circle cx="470" cy="60" r="3"/>
    <circle cx="430" cy="80" r="3"/><circle cx="450" cy="80" r="3"/><circle cx="470" cy="80" r="3"/>
    <circle cx="430" cy="100" r="3"/><circle cx="450" cy="100" r="3"/><circle cx="470" cy="100" r="3"/>
    <circle cx="450" cy="120" r="3"/><circle cx="470" cy="120" r="3"/>
  </g>

  <!-- Torso and Shoulders -->
  <path d="M120 540 Q130 420 180 390 L250 420 L320 390 Q370 420 380 540 L420 600 L80 600 Z" fill="url(#suitBlue)"/>
  <path d="M180 390 L250 420 L320 390 L310 600 L190 600 Z" fill="url(#suitRed)"/>
  
  <!-- Chest Spider Silhouette -->
  <path d="M250 450 C242 445 238 455 235 465 C225 450 215 455 205 462 C220 472 232 472 238 478 L232 500 C220 515 205 520 195 515 C208 528 225 524 236 512 L242 530 L250 545 L258 530 L264 512 C275 524 292 528 305 515 C295 520 280 515 268 500 L262 478 C268 472 280 472 295 462 C285 455 275 450 265 465 C262 455 258 445 250 450 Z" fill="#0c0d12"/>

  <!-- Neck -->
  <path d="M210 330 L210 400 Q250 420 290 400 L290 330 Z" fill="url(#suitRed)"/>
  <!-- Neck Web Lines -->
  <path d="M250 330 L250 410 M225 350 Q250 365 275 350 M220 380 Q250 395 280 380" stroke="#1a0005" stroke-width="2.5" fill="none"/>

  <!-- Head Base -->
  <path d="M150 230 C150 120 200 90 250 90 C300 90 350 120 350 230 C350 320 305 375 250 375 C195 375 150 320 150 230 Z" fill="url(#suitRed)"/>

  <!-- Mask Web Lines -->
  <!-- Radiating Web Lines -->
  <g stroke="#260308" stroke-width="2.5" fill="none">
    <line x1="250" y1="230" x2="250" y2="92"/>
    <line x1="250" y1="230" x2="215" y2="98"/>
    <line x1="250" y1="230" x2="285" y2="98"/>
    <line x1="250" y1="230" x2="185" y2="120"/>
    <line x1="250" y1="230" x2="315" y2="120"/>
    <line x1="250" y1="230" x2="160" y2="160"/>
    <line x1="250" y1="230" x2="340" y2="160"/>
    <line x1="250" y1="230" x2="152" y2="230"/>
    <line x1="250" y1="230" x2="348" y2="230"/>
    <line x1="250" y1="230" x2="162" y2="295"/>
    <line x1="250" y1="230" x2="338" y2="295"/>
    <line x1="250" y1="230" x2="200" y2="350"/>
    <line x1="250" y1="230" x2="300" y2="350"/>
    <line x1="250" y1="230" x2="250" y2="375"/>
    <!-- Concentric Web Arcs -->
    <path d="M228 130 Q250 145 272 130"/>
    <path d="M210 160 Q250 180 290 160"/>
    <path d="M195 195 Q250 220 305 195"/>
    <path d="M185 240 Q250 270 315 240"/>
    <path d="M195 285 Q250 315 305 285"/>
    <path d="M215 330 Q250 355 285 330"/>
  </g>

  <!-- Left Eye Outer Black Border -->
  <path d="M240 220 C235 180 200 160 165 175 C160 215 170 270 238 275 C242 255 242 235 240 220 Z" fill="#0d0e13" stroke="#000000" stroke-width="4"/>
  <!-- Left Eye Inner White Lens -->
  <path d="M232 222 C228 190 200 174 175 184 C172 215 180 255 230 264 C234 250 234 235 232 222 Z" fill="url(#lensGleam)"/>

  <!-- Right Eye Outer Black Border -->
  <path d="M260 220 C265 180 300 160 335 175 C340 215 330 270 262 275 C258 255 258 235 260 220 Z" fill="#0d0e13" stroke="#000000" stroke-width="4"/>
  <!-- Right Eye Inner White Lens -->
  <path d="M268 222 C272 190 300 174 325 184 C328 215 320 255 270 264 C266 250 266 235 268 222 Z" fill="url(#lensGleam)"/>

  <!-- Atmospheric Comic Rim Lighting & Web Particle -->
  <path d="M152 230 C152 135 195 95 245 92" stroke="#ff8591" stroke-width="3" fill="none" opacity="0.4"/>
  <circle cx="250" cy="50" r="1.5" fill="#f7f4ea" opacity="0.7"/>
  <circle cx="390" cy="180" r="2" fill="#f7f4ea" opacity="0.5"/>
</svg>
