<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="miguelBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a060e"/>
      <stop offset="60%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="cyberSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="40%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="skullCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a35"/>
      <stop offset="50%" stop-color="#c51b29"/>
      <stop offset="100%" stop-color="#800a14"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#miguelBg)"/>

  <!-- Cyberpunk Perspective Grid (Nueva York 2099) -->
  <g stroke="#ff1a35" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <line x1="250" y1="200" x2="20" y2="600"/>
    <line x1="250" y1="200" x2="90" y2="600"/>
    <line x1="250" y1="200" x2="170" y2="600"/>
    <line x1="250" y1="200" x2="330" y2="600"/>
    <line x1="250" y1="200" x2="410" y2="600"/>
    <line x1="250" y1="200" x2="480" y2="600"/>
    <ellipse cx="250" cy="500" rx="200" ry="80"/>
    <ellipse cx="250" cy="450" rx="140" ry="50"/>
  </g>

  <!-- Massive Shoulders & Traps -->
  <path d="M70 560 Q100 400 170 370 L250 400 L330 370 Q400 400 430 560 L460 600 L40 600 Z" fill="url(#cyberSuit)"/>

  <!-- Arm Cyber Spikes Silhouettes -->
  <polygon points="65,480 35,460 70,510" fill="url(#skullCrimson)"/>
  <polygon points="55,530 25,515 62,555" fill="url(#skullCrimson)"/>
  <polygon points="435,480 465,460 430,510" fill="url(#skullCrimson)"/>
  <polygon points="445,530 475,515 438,555" fill="url(#skullCrimson)"/>

  <!-- Chest Skull-Spider Insignia (Aggressive 2099 Motif) -->
  <g fill="url(#skullCrimson)" filter="url(#cyberGlow)">
    <!-- Central Fanged Skull Chest -->
    <path d="M250 430 L235 448 L240 470 L250 480 L260 470 L265 448 Z"/>
    <polygon points="244,480 240,498 248,490"/>
    <polygon points="256,480 260,498 252,490"/>
    <!-- Upper Chest Wings / Legs -->
    <path d="M234 445 L170 410 L150 422 L225 455 Z"/>
    <path d="M266 445 L330 410 L350 422 L275 455 Z"/>
    <path d="M228 460 L140 450 L130 465 L224 472 Z"/>
    <path d="M272 460 L360 450 L370 465 L276 472 Z"/>
    <!-- Lower Extended Spikes -->
    <path d="M232 475 L155 520 L165 535 L236 490 Z"/>
    <path d="M268 475 L345 520 L335 535 L264 490 Z"/>
  </g>

  <!-- Thick Neck -->
  <path d="M200 320 L200 400 Q250 415 300 400 L300 320 Z" fill="url(#cyberSuit)"/>

  <!-- Angular Chiseled Head -->
  <path d="M155 220 C155 120 200 85 250 85 C300 85 345 120 345 220 C345 315 300 370 250 370 C200 370 155 315 155 220 Z" fill="url(#cyberSuit)"/>

  <!-- Face Skull Mask Pattern (Crimson 2099 Markings) -->
  <g fill="url(#skullCrimson)">
    <!-- Central Forehead Wedge -->
    <polygon points="250,95 240,160 250,175 260,160"/>
    <!-- Brow & Cheek Slash Graphics -->
    <path d="M235 165 L180 155 L165 170 L230 185 Z"/>
    <path d="M265 165 L320 155 L335 170 L270 185 Z"/>
    <!-- Jaw Fangs Lines -->
    <path d="M225 290 L175 270 L185 330 L230 310 Z"/>
    <path d="M275 290 L325 270 L315 330 L270 310 Z"/>
    <!-- Chin Spike -->
    <polygon points="250,335 242,365 250,368 258,365"/>
  </g>

  <!-- Aggressive Narrow Predatory Eyes -->
  <!-- Left Eye Outer Red Socket -->
  <path d="M242 225 L180 205 L175 245 L238 250 Z" fill="#08090d" stroke="#ff1a35" stroke-width="3"/>
  <path d="M236 228 L188 213 L185 240 L234 245 Z" fill="#ff2b42" filter="url(#cyberGlow)"/>
  
  <!-- Right Eye Outer Red Socket -->
  <path d="M258 225 L320 205 L325 245 L262 250 Z" fill="#08090d" stroke="#ff1a35" stroke-width="3"/>
  <path d="M264 228 L312 213 L315 240 L266 245 Z" fill="#ff2b42" filter="url(#cyberGlow)"/>

  <!-- High-Tech Rim Lighting -->
  <path d="M156 220 C156 130 195 90 250 87" stroke="#ff1a35" stroke-width="2.5" fill="none" opacity="0.6"/>
</svg>
